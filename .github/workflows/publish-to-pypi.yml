name: Build and publish

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:

  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mkdocs gh-deploy pushes to gh-pages
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout the repository and the branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install build tools and documentation dependencies
        run: uv sync --extra dev --extra docs

      - name: Build a binary wheel and a source tarball
        run: >-
          python -m
          build
          --sdist
          --wheel
          --outdir dist/

      - name: Setup the GitHub user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Update the GitHub pages documentation
        run: uv run mkdocs gh-deploy --force --clean --config-file docs/mkdocs.yml

      - name: Publish distribution package to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
